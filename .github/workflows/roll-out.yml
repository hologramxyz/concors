name: Roll out

# Offers published versions to everyone: points the control plane at them and, for the desktop
# app, marks its release Latest, which is what the website's download button follows. release.yml
# runs this at its end; run it by hand to roll out a release published with roll-out off, or to
# roll back by naming an earlier version.
#
# A new DAEMON_VERSION interrupts nobody: the control plane installs it on a cloud machine only
# while no agent there is working or waiting for an answer, or when the machine's owner presses
# Update now in the app (installing restarts the machine's agents).
on:
  workflow_dispatch:
    inputs:
      desktop_version:
        description: Desktop version to offer, e.g. 0.6.15 (empty leaves it alone)
        type: string
      daemon_version:
        description: Daemon version for cloud machines, e.g. 0.6.15 (empty leaves it alone)
        type: string
  workflow_call:
    inputs:
      desktop_version:
        type: string
      daemon_version:
        type: string

permissions:
  contents: write

concurrency:
  group: roll-out
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  DESKTOP_VERSION: ${{ inputs.desktop_version }}
  DAEMON_VERSION: ${{ inputs.daemon_version }}
  # The production control plane, in the Holoworld AI workspace's `concors` project.
  API_URL: https://api.concors.dev

jobs:
  roll-out:
    name: Point production at the release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Publish first, pin second: a pinned version with no release behind it breaks the update
      # check until one exists.
      - name: Check the releases exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$DESKTOP_VERSION$DAEMON_VERSION" ] || { echo "Name a version to roll out" >&2; exit 1; }
          if [ -n "$DESKTOP_VERSION" ]; then gh release view "desktop-v$DESKTOP_VERSION" > /dev/null; fi
          if [ -n "$DAEMON_VERSION" ]; then gh release view "daemon-v$DAEMON_VERSION" > /dev/null; fi

      # One `variable set` for both, so the server redeploys once.
      - name: Pin the versions on the control plane
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          [ -n "$RAILWAY_TOKEN" ] || {
            echo "RAILWAY_TOKEN is not set; see Releasing in AGENTS.md" >&2; exit 1; }
          variables=()
          if [ -n "$DESKTOP_VERSION" ]; then variables+=("DESKTOP_VERSION=$DESKTOP_VERSION"); fi
          if [ -n "$DAEMON_VERSION" ]; then variables+=("DAEMON_VERSION=$DAEMON_VERSION"); fi
          npx --yes @railway/cli@5.62.1 variable set "${variables[@]}" \
            --service concors-server --environment production

      - name: Make the desktop release the one new downloads get
        if: inputs.desktop_version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "desktop-v$DESKTOP_VERSION" --latest

      # Read back the way a running app asks, once the redeploy has picked the variable up.
      - name: Check the control plane offers it
        if: inputs.desktop_version != ''
        run: |
          for attempt in $(seq 1 60); do
            offered="$(curl -fsS "$API_URL/api/v1/releases/desktop/linux/x86_64/0.0.1" \
              | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version' 2>/dev/null || true)"
            if [ "$offered" = "$DESKTOP_VERSION" ]; then echo "Offering $offered"; exit 0; fi
            sleep 10
          done
          echo "The control plane still offers ${offered:-nothing}, not $DESKTOP_VERSION" >&2
          exit 1

  # Arch and Omarchy users install concors-bin from the AUR, and their AUR helper updates it when
  # this job pushes a newer PKGBUILD, so it is part of rolling out like the variables above.
  aur:
    name: Publish to the AUR
    needs: roll-out
    if: inputs.desktop_version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - name: Check the AUR key is configured
        id: key
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::warning::AUR_SSH_PRIVATE_KEY is not set, so the AUR still has the previous version."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # A rollback names an older version; AUR helpers never downgrade, so the AUR keeps the newer
      # one and says so rather than publishing something nobody would install.
      - name: Skip versions older than the AUR's
        id: newer
        if: steps.key.outputs.present == 'true'
        run: |
          current="$(curl -fsS 'https://aur.archlinux.org/rpc/v5/info?arg[]=concors-bin' \
            | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).results[0]?.Version ?? ""')"
          current="${current%-*}"
          if [ -n "$current" ] && [ "$(printf '%s\n%s\n' "$current" "$DESKTOP_VERSION" | sort -V | tail -1)" = "$current" ] \
            && [ "$current" != "$DESKTOP_VERSION" ]; then
            echo "::notice::The AUR has $current, newer than $DESKTOP_VERSION; leaving it."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.newer.outputs.publish == 'true'
        with:
          ref: desktop-v${{ inputs.desktop_version }}
          persist-credentials: false

      - name: Prepare and test-build the PKGBUILD
        if: steps.newer.outputs.publish == 'true'
        run: |
          mkdir -p aur-out && chmod 777 aur-out
          docker run --rm -e DESKTOP_VERSION -v "$PWD/packaging/linux:/src:ro" -v "$PWD/aur-out:/out" \
            archlinux:base-devel bash -ec '
              pacman -Sy --noconfirm --needed pacman-contrib > /dev/null
              useradd -m builder
              su builder -c "/src/prepare-aur.sh $DESKTOP_VERSION /out"
            '
          cat aur-out/.SRCINFO

      - name: Push to the AUR
        if: steps.newer.outputs.publish == 'true'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          # Pinned: this is the ED25519 key aur.archlinux.org publishes on its home page.
          echo "aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN" \
            > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git clone -q ssh://aur@aur.archlinux.org/concors-bin.git aur
          cp aur-out/PKGBUILD aur-out/.SRCINFO aur-out/concors.sh aur-out/concors.desktop aur/
          cd aur
          git add PKGBUILD .SRCINFO concors.sh concors.desktop
          if git diff --cached --quiet; then
            echo "The AUR already has concors-bin $DESKTOP_VERSION."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Update to $DESKTOP_VERSION"
          git push -q origin HEAD:master
          echo "Published concors-bin $DESKTOP_VERSION: https://aur.archlinux.org/packages/concors-bin"
