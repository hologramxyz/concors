name: Heavy tests

# The slow, expensive suites that used to run on every push and PR: browser
# acceptance tests, Tauri/Rust checks, packaged-bundle smoke tests, and the
# macOS/Windows runners (billed at 10x/2x). Run them on demand from the
# Actions tab after touching the areas they cover; release.yml runs them before
# every release.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: >-
          Called by release.yml. Suites that do not test what a desktop or daemon release ships,
          or that fail on main today, then report without blocking it.
        type: boolean
        default: false

jobs:
  # Bundle and packaging checks that used to live in the CI "node" job.
  bundles:
    name: Daemon and app bundles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version is read from the `packageManager` field in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm daemon:build
      - run: pnpm desktop:web:build
      - run: pnpm mobile:build
        env:
          EXPO_NO_TELEMETRY: "1"
          CI: "1"

      - name: Smoke-test the isolated daemon bundle
        run: pnpm --filter @concors/daemon exec node scripts/smoke-bundle.ts

      - name: Package Linux daemon
        run: pnpm --filter @concors/daemon package:linux

      - name: Run release on clean Ubuntu 24.04 without Node or compilers
        run: |
          docker run --rm --network none \
            -v "$PWD/packages/daemon/dist/release/concors-daemon-linux-x64.tar.gz:/artifact.tar.gz:ro" \
            -v "$PWD/packages/daemon/scripts/smoke-bundle.ts:/smoke-bundle.ts:ro" \
            ubuntu:24.04 sh -ec '
              for tool in node npm pnpm gcc g++ cc make clang; do
                if command -v "$tool"; then echo "Unexpected preinstalled tool: $tool"; exit 1; fi
              done
              mkdir /opt/concors
              tar -xzf /artifact.tar.gz -C /opt/concors
              /opt/concors/concors-daemon/bin/concors-daemon --version
              /opt/concors/concors-daemon/bin/node /smoke-bundle.ts --release /opt/concors/concors-daemon
            '

  # Compile platform-specific notification bridges; packaged OS smoke tests remain separate.
  tauri:
    name: Tauri (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4

      - name: Disable unused Chrome package source
        if: runner.os == 'Linux'
        # Its package index can fail apt-get update; Tauri only needs Ubuntu libraries.
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # tauri-build validates that `frontendDist` exists, so the frontend must be built first.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Session continuity on the native platform
        run: pnpm --filter @concors/daemon exec vitest run src/hosting/gateway.test.ts src/terminal/profiles.test.ts src/terminal/working-directory.test.ts src/projects/manager.test.ts src/workspace/folder-continuity.test.ts src/agents/providers/launch.test.ts src/agents/providers/adapters.test.ts
      - run: pnpm desktop:web:build

      - name: cargo fmt
        run: cargo fmt --check
        working-directory: apps/desktop/src-tauri

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri

  workspace-browser:
    name: Workspace browser acceptance
    runs-on: ubuntu-latest
    # The complete single-worker suite takes about 8–10 minutes before dependency setup.
    timeout-minutes: 15
    # Times out on main today; blocks releases again once it passes.
    continue-on-error: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Disable unused Chrome package source
        # Playwright downloads its own Chromium; this runner-provided apt source is unused.
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:workspace:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: workspace-browser-traces
          path: test-results/

  mobile-browser:
    name: Mobile browser (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [e2e, direct, managed]
    runs-on: ubuntu-latest
    # Include bundle generation and the full phone interaction suite (about 7 minutes).
    timeout-minutes: 15
    # The mobile app is not released by release.yml, and e2e and direct fail on main today.
    continue-on-error: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:mobile:${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-browser-evidence-${{ matrix.suite }}
          path: apps/mobile/test-results/

  terminal-platforms:
    name: Terminal runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    # Windows is not a release platform yet, and its runtime tests have known path failures.
    continue-on-error: ${{ inputs.release && matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm daemon:test
      - run: pnpm daemon:build
      - name: Smoke-test the isolated native bundle
        run: pnpm --filter @concors/daemon exec node scripts/smoke-bundle.ts
