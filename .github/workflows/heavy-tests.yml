name: Heavy tests

# The slow suites, kept out of ci.yml so its checks stay quick: browser acceptance tests,
# Tauri/Rust checks, packaged-bundle smoke tests, and the macOS/Windows runners. They run on every
# pull request that touches more than docs, so a regression shows before it merges rather than at
# release time, and can be dispatched by hand. release.yml runs only the build and runtime checks:
# the browser suites have already run on every pull request that reached main.
on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "third-party/**"]
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Called by release.yml, which skips the browser suites.
        type: boolean
        default: false

# A newer push to a pull request supersedes its run; a release or a dispatched run is never cut short.
concurrency:
  group: heavy-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Bundle and packaging checks that used to live in the CI "node" job.
  bundles:
    name: Daemon and app bundles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version is read from the `packageManager` field in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm daemon:build
      - run: pnpm desktop:web:build
      - run: pnpm mobile:build
        env:
          EXPO_NO_TELEMETRY: "1"
          CI: "1"

      - name: Smoke-test the isolated daemon bundle
        run: pnpm --filter @concors/daemon exec node scripts/smoke-bundle.ts

      - name: Package Linux daemon
        run: pnpm --filter @concors/daemon package:linux

      - name: Run release on clean Ubuntu 24.04 without Node or compilers
        run: |
          docker run --rm --network none \
            -v "$PWD/packages/daemon/dist/release/concors-daemon-linux-x64.tar.gz:/artifact.tar.gz:ro" \
            -v "$PWD/packages/daemon/scripts/smoke-bundle.ts:/smoke-bundle.ts:ro" \
            ubuntu:24.04 sh -ec '
              for tool in node npm pnpm gcc g++ cc make clang; do
                if command -v "$tool"; then echo "Unexpected preinstalled tool: $tool"; exit 1; fi
              done
              mkdir /opt/concors
              tar -xzf /artifact.tar.gz -C /opt/concors
              /opt/concors/concors-daemon/bin/concors-daemon --version
              /opt/concors/concors-daemon/bin/node /smoke-bundle.ts --release /opt/concors/concors-daemon
            '

  # Compile platform-specific notification bridges; packaged OS smoke tests remain separate.
  tauri:
    name: Tauri (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4

      - name: Disable unused Chrome package source
        if: runner.os == 'Linux'
        # Its package index can fail apt-get update; Tauri only needs Ubuntu libraries.
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # tauri-build validates that `frontendDist` exists, so the frontend must be built first.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Session continuity on the native platform
        run: pnpm --filter @concors/daemon exec vitest run src/hosting/gateway.test.ts src/terminal/profiles.test.ts src/terminal/working-directory.test.ts src/projects/manager.test.ts src/workspace/folder-continuity.test.ts src/agents/providers/launch.test.ts src/agents/providers/adapters.test.ts
      - run: pnpm desktop:web:build

      - name: cargo fmt
        run: cargo fmt --check
        working-directory: apps/desktop/src-tauri

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri

  # Split across runners: the suite runs one test at a time against one shared daemon, so it
  # cannot run in parallel on one machine, but each runner starts its own daemon.
  workspace-browser:
    name: Workspace browser acceptance (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    # The single-worker suite takes about 12–14 minutes in all, so a quarter of it plus setup.
    timeout-minutes: 15
    if: inputs.release != true
    steps:
      - uses: actions/checkout@v4
      - name: Disable unused Chrome package source
        # Playwright downloads its own Chromium; this runner-provided apt source is unused.
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:workspace:e2e --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: workspace-browser-traces-${{ matrix.shard }}
          path: test-results/

  # e2e and direct are split across runners like the workspace suite; managed takes a minute.
  mobile-browser:
    name: Mobile browser (${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.shards }})
    if: inputs.release != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: e2e, shard: 1, shards: 3 }
          - { suite: e2e, shard: 2, shards: 3 }
          - { suite: e2e, shard: 3, shards: 3 }
          - { suite: direct, shard: 1, shards: 3 }
          - { suite: direct, shard: 2, shards: 3 }
          - { suite: direct, shard: 3, shards: 3 }
          - { suite: managed, shard: 1, shards: 1 }
    runs-on: ubuntu-latest
    # Include bundle generation and the full phone interaction suite (about 7 minutes).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:mobile:${{ matrix.suite }} --shard=${{ matrix.shard }}/${{ matrix.shards }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-browser-evidence-${{ matrix.suite }}-${{ matrix.shard }}
          path: apps/mobile/test-results/

  terminal-platforms:
    name: Terminal runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm daemon:test
      - run: pnpm daemon:build
      - name: Smoke-test the isolated native bundle
        run: pnpm --filter @concors/daemon exec node scripts/smoke-bundle.ts
