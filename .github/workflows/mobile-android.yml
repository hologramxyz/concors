name: Mobile Android native

on:
  # Native compilation and simulator tests are opt-in, outside the PR time budget.
  workflow_dispatch:
    inputs:
      marketing_captures:
        description: Capture the Android store screens with fictional projects
        type: boolean
        default: false
      preview_run_id:
        description: Reuse a preview APK from a successful native build in this repository
        type: string
        default: ""
      candidate_aab_url:
        description: Audit and smoke-test a production Expo AAB instead of building a preview
        type: string
        default: ""
      candidate_sha256:
        description: Expected production AAB SHA-256
        type: string
        default: ""
      candidate_version_code:
        description: Expected production Android version code
        type: string
        default: ""
      candidate_cert_sha256:
        description: Public upload certificate SHA-256 from Expo credentials
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Android native build
    if: inputs.preview_run_id == '' && inputs.candidate_aab_url == ''
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 35 || 20 }}
    env:
      APP_VARIANT: preview
      EXPO_PUBLIC_DEMO: "true"
      EXPO_PUBLIC_STORE_CAPTURE: ${{ inputs.marketing_captures && 'true' || 'false' }}
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    steps:
      - name: Reserve space for native build tools
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @concors/mobile assets
      - name: Generate native Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install
      - uses: actions/cache@v4
        with:
          path: |
            apps/mobile/android/.gradle
            apps/mobile/android/app/.cxx
            node_modules/.pnpm/**/android/.cxx
          key: android-native-v1-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.config.ts', 'apps/mobile/scripts/ci-native.gradle') }}-${{ github.sha }}
          restore-keys: android-native-v1-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.config.ts', 'apps/mobile/scripts/ci-native.gradle') }}-
      - name: Build standalone simulator APK (release packaging on manual runs)
        timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 30 || 15 }}
        # Preview identity and demo data only. Neither artifact may be submitted to a store.
        working-directory: apps/mobile/android
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ./gradlew :app:assembleRelease :app:bundleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --build-cache --parallel --max-workers=4 --no-daemon
          else
            ./gradlew :app:assembleRelease --init-script ../scripts/ci-native.gradle -PreactNativeArchitectures=x86_64 --build-cache --parallel --max-workers=4 --no-daemon
          fi
      - name: Audit target SDK, permissions and 16 KB native alignment
        run: node apps/mobile/scripts/android-artifact-check.mjs apps/mobile/android/app/build/outputs/apk/release/app-release.apk ${{ github.event_name == 'workflow_dispatch' && 'arm64-v8a,x86_64' || 'x86_64' }}
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android-app
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: mobile-android-release-bundle
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab

  ui:
    name: Android native UI
    needs: native
    if: ${{ !cancelled() && (needs.native.result == 'success' || inputs.preview_run_id != '' || inputs.candidate_aab_url != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # A clean runner keeps compiler objects from crowding out the emulator image.
      - name: Reserve emulator disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        if: inputs.candidate_aab_url == ''
        with:
          name: mobile-android-app
          path: native-app
          github-token: ${{ github.token }}
          run-id: ${{ inputs.preview_run_id || github.run_id }}
      - name: Validate production AAB and derive an emulator APK
        if: inputs.candidate_aab_url != ''
        env:
          CANDIDATE_AAB_URL: ${{ inputs.candidate_aab_url }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          CANDIDATE_VERSION_CODE: ${{ inputs.candidate_version_code }}
          CANDIDATE_CERT_SHA256: ${{ inputs.candidate_cert_sha256 }}
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool.jar
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { mkdirSync, writeFileSync } from 'node:fs';
          const url = new URL(process.env.CANDIDATE_AAB_URL);
          if (url.protocol !== 'https:' || url.hostname !== 'expo.dev' || !url.pathname.startsWith('/artifacts/eas/')) throw new Error('Expected an Expo build artifact');
          if (!/^[a-f0-9]{64}$/.test(process.env.CANDIDATE_SHA256 ?? '')) throw new Error('Expected an AAB SHA-256');
          const response = await fetch(url);
          if (!response.ok) throw new Error(`Artifact download failed: ${response.status}`);
          const bytes = Buffer.from(await response.arrayBuffer());
          if (createHash('sha256').update(bytes).digest('hex') !== process.env.CANDIDATE_SHA256) throw new Error('AAB checksum mismatch');
          mkdirSync('native-app', { recursive: true });
          writeFileSync('native-app/candidate.aab', bytes);
          NODE
          curl --fail --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output "$BUNDLETOOL_JAR"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $BUNDLETOOL_JAR" | sha256sum --check
          node apps/mobile/scripts/android-candidate-check.mjs native-app/candidate.aab
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -alias concors-smoke -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Concors emulator smoke' -storepass android -keypass android
          java -jar "$BUNDLETOOL_JAR" build-apks --bundle=native-app/candidate.aab --output="$RUNNER_TEMP/smoke.apks" --mode=universal --ks="$RUNNER_TEMP/smoke.jks" --ks-key-alias=concors-smoke --ks-pass=pass:android --key-pass=pass:android
          unzip -p "$RUNNER_TEMP/smoke.apks" universal.apk > native-app/app-release.apk
          node apps/mobile/scripts/android-artifact-check.mjs native-app/app-release.apk
      - name: Install pinned native UI test runner
        run: |
          curl --fail --location --retry 3 https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.10.0/maestro.zip --output "$RUNNER_TEMP/maestro.zip"
          echo '29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991  maestro.zip' | (cd "$RUNNER_TEMP" && sha256sum --check)
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise installed Android workspace and keyboard
        timeout-minutes: 7
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          disable-animations: true
          script: |
            adb install native-app/app-release.apk
            adb shell settings put global sysui_demo_allowed 1
            adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 0941
            adb shell am broadcast -a com.android.systemui.demo -e command battery -e level 100 -e plugged false
            maestro test --test-output-dir apps/mobile/test-results/android apps/mobile/e2e/native/${{ inputs.candidate_aab_url != '' && 'android-release-smoke' || inputs.marketing_captures && 'android-store-marketing' || 'android' }}.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-android-native-evidence
          path: |
            apps/mobile/test-results/android/
