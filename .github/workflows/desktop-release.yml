name: Desktop release

on:
  push:
    tags: [desktop-v*]

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}
  GH_REPO: ${{ github.repository }}
  # Published builds talk to production. A release pointed at the development API would look
  # identical and quietly send everyone who installed it to the wrong control plane.
  VITE_CONCORS_API_URL: https://api.concors.dev

jobs:
  build:
    name: Build and test Linux release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a commit on main
        run: git merge-base --is-ancestor HEAD origin/main

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify tag matches the desktop version
        id: version
        # release-version.ts fails unless package.json, tauri.conf.json and the PKGBUILD agree.
        run: |
          version="$(node apps/desktop/scripts/release-version.ts)"
          [ "$RELEASE_TAG" = "desktop-v$version" ] || {
            echo "Tag $RELEASE_TAG must match desktop-v$version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Disable unused Chrome package source
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      # Builds the daemon, checks its relocated runtime with a real PTY, then the app binary.
      - name: Build the app and its bundled daemon
        run: pnpm desktop:package:linux --no-bundle

      - name: Assemble the relocatable tree
        run: pnpm desktop:release:linux

      - name: Build the Arch package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Restages the tarball; nothing is compiled here, so an artifact built on Ubuntu 24.04
        # (the oldest base we support) keeps its own glibc floor inside the pacman package.
        run: |
          docker run --rm -v "$PWD:/w" -e VERSION archlinux:base-devel bash -ec '
            useradd -m builder
            install -d -o builder /out
            cp -r /w/packaging/linux /home/builder/packaging
            cp "/w/apps/desktop/dist/release/Concors-$VERSION-x64.tar.gz" /home/builder/
            chown -R builder /home/builder
            su builder -c "/home/builder/packaging/build-package.sh \
              /home/builder/Concors-$VERSION-x64.tar.gz $VERSION /out"
            cp /out/*.pkg.tar.zst /w/apps/desktop/dist/release/
          '

      - name: Install the package on clean Arch and run the bundled daemon
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # -dd skips every dependency check (once would only skip version checks), so the GUI
        # libraries an installing machine supplies are not needed here. The daemon is
        # self-contained, so it must still run in a container that has nothing else.
        run: |
          docker run --rm --network none -e VERSION \
            -v "$PWD/apps/desktop/dist/release:/rel:ro" archlinux:base bash -ec '
              pacman -U --noconfirm -dd /rel/concors-bin-*.pkg.tar.zst
              test -x /opt/Concors/bin/concors-desktop
              test -x /usr/bin/concors
              test -f /usr/share/applications/concors.desktop
              test -f /usr/share/icons/hicolor/256x256/apps/concors.png
              installed="$(pacman -Q concors-bin | cut -d" " -f2)"
              [ "$installed" = "$VERSION-1" ] || { echo "pacman recorded $installed" >&2; exit 1; }
              /opt/Concors/lib/Concors/daemon/bin/concors-daemon --version
            '

      - name: Sign the builds
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Without the key a release still publishes, unsigned, and the badge still installs it
        # after checking the digest. A signature is what proves a build came from us rather than
        # from whoever served it, and it is what `tauri-plugin-updater` refuses to go without, so
        # the absence is a loud warning rather than a silent default.
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; publishing an unsigned release."
            exit 0
          fi
          # Absolute paths: `pnpm --filter … exec` runs the signer from apps/desktop, where a
          # repository-relative path does not exist.
          for artifact in "$PWD"/apps/desktop/dist/release/Concors-*-x64.tar.gz \
                          "$PWD"/apps/desktop/dist/release/concors-bin-*.pkg.tar.zst; do
            pnpm --filter @concors/desktop exec tauri signer sign "$artifact" > /dev/null
            test -s "$artifact.sig" || { echo "no signature for $artifact" >&2; exit 1; }
            echo "signed $(basename "$artifact")"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x64
          path: |
            apps/desktop/dist/release/Concors-*-x64.tar.gz
            apps/desktop/dist/release/Concors-*-x64.tar.gz.sha256
            apps/desktop/dist/release/concors-bin-*.pkg.tar.zst
            apps/desktop/dist/release/*.sig
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # Secrets cannot gate a job directly, so this one reads them and says whether the Mac build runs.
  apple-credentials:
    name: Check Apple signing credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        # An unsigned disk image is worse than none: macOS calls it damaged and offers only the bin.
        # So without credentials the release simply has no Mac build, and says so.
        run: |
          if [ -n "${APPLE_CERTIFICATE:-}" ] && [ -n "${APPLE_API_PRIVATE_KEY:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Apple signing secrets are not set; this release has no macOS build."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    name: Build and notarize macOS release
    needs: apple-credentials
    if: needs.apple-credentials.outputs.present == 'true'
    # Apple Silicon. The daemon runtime bundles the host's Node and native modules, so an Intel
    # build would be a second job on an Intel runner rather than a flag here.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a commit on main
        run: git merge-base --is-ancestor HEAD origin/main

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify tag matches the desktop version
        run: |
          version="$(node apps/desktop/scripts/release-version.ts)"
          [ "$RELEASE_TAG" = "desktop-v$version" ] || {
            echo "Tag $RELEASE_TAG must match desktop-v$version" >&2; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      # Into a keychain of its own, so the identity exists only for this job. Tauri can import a
      # certificate itself, but the daemon runtime is signed before Tauri runs and needs it first.
      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          [ -n "$identity" ] || { echo "The certificate holds no Developer ID Application identity" >&2; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Write the notary service key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/notary.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      # Signs the daemon runtime and checks it still runs a PTY under the hardened runtime, then
      # builds, signs and notarizes the app and wraps it in a disk image.
      - name: Build the app and its bundled daemon
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm desktop:package:macos

      - name: Sign, notarize and check the disk image
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm desktop:release:macos --require-notarized

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-aarch64
          path: apps/desktop/dist/release/Concors-*-aarch64.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish release
    needs: [build, apple-credentials, build-macos]
    # A skipped Mac build (no credentials) still publishes Linux; a failed one publishes nothing.
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Only for release-manifest.ts, which needs nothing beyond Node itself.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: apps/desktop/dist/release

      - name: Write the release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        # The tag's annotation becomes the release notes the app shows before updating, so it is
        # read from the API rather than the checkout: actions/checkout creates the local tag ref
        # from the commit SHA, which makes it lightweight, and `%(contents)` on a lightweight tag
        # quietly yields the commit message instead. A release would then offer people
        # "Merge pull request #124" as its description.
        run: |
          object="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.type + " " + .object.sha')"
          if [ "${object%% *}" = "tag" ]; then
            gh api "repos/$GH_REPO/git/tags/${object##* }" --jq '.message' > /tmp/notes.txt
          else
            echo "::warning::$RELEASE_TAG is not an annotated tag, so the release has no notes."
            : > /tmp/notes.txt
          fi
          [ -s /tmp/notes.txt ] || echo "Concors $VERSION." > /tmp/notes.txt
          cat /tmp/notes.txt
          node apps/desktop/scripts/release-manifest.ts --notes-file /tmp/notes.txt

      - name: Create release with tested builds
        working-directory: apps/desktop/dist/release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        # The directory holds exactly what the build jobs uploaded, plus release.json.
        run: |
          ls -l
          gh release create "$RELEASE_TAG" * \
            --verify-tag --title "Concors $VERSION" --latest=false \
            --notes "Concors $VERSION. macOS (Apple Silicon): open the .dmg and drag Concors to Applications. Arch/Omarchy: install the .pkg.tar.zst with \`pacman -U\`. Other Linux x86_64: extract the tarball and run \`bin/concors-desktop\`, keeping \`bin/\` and \`lib/\` siblings. release.json is what the control plane reads to offer in-app updates."

  verify-download:
    name: Verify anonymous release download
    needs: [build, publish]
    # Without this, a skipped Mac build skips this job too: the implicit success() looks through
    # `publish` at every job it depends on, even though `publish` itself ran.
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download the published release and check it describes itself
        env:
          VERSION: ${{ needs.build.outputs.version }}
        # This is the path the control plane takes, without a token since the repository is public:
        # read release.json, then fetch what it names.
        run: |
          download() { curl -fsSL -o "$1" "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/$1"; }
          download release.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('release.json', 'utf8'));
          if (manifest.version !== process.env.VERSION)
            throw new Error(`manifest is ${manifest.version}, expected ${process.env.VERSION}`);
          const formats = manifest.artifacts.map((a) => a.format);
          // Linux always ships; the disk image only when Apple credentials are configured.
          for (const required of ['pacman', 'tarball'])
            if (!formats.includes(required)) throw new Error(`no ${required} in the manifest`);
          const unknown = formats.filter((f) => !['pacman', 'tarball', 'dmg'].includes(f));
          if (unknown.length) throw new Error(`unexpected formats: ${unknown.join(',')}`);
          console.log(manifest.artifacts.map((a) => `${a.format} ${a.name} ${a.sha256}`).join('\n'));
          NODE
          for asset in $(node -p "JSON.parse(require('fs').readFileSync('release.json','utf8')).artifacts.map(a=>a.name).join('\n')"); do
            download "$asset"
            expected="$(node -p "JSON.parse(require('fs').readFileSync('release.json','utf8')).artifacts.find(a=>a.name==='$asset').sha256")"
            echo "$expected  $asset" | sha256sum -c -
          done
