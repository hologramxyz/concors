name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that runs on plain Node: lint, typecheck, tests, daemon bundle, frontend bundle.
  node:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version is read from the `packageManager` field in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm daemon:build
      - run: pnpm desktop:web:build
      - run: pnpm mobile:build
        env:
          EXPO_NO_TELEMETRY: "1"
          CI: "1"

      - name: Smoke-test the daemon bundle
        run: |
          node packages/daemon/dist/cli.js --version
          node packages/daemon/dist/cli.js serve --port 7420 --log-level warn &
          DAEMON_PID=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:7420/health && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:7420/health | grep -q '"status":"ok"'
          kill -TERM "$DAEMON_PID"
          wait "$DAEMON_PID"
          node packages/daemon/dist/cli.js stop-host

  # Compile platform-specific notification bridges; packaged OS smoke tests remain separate.
  tauri:
    name: Tauri (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Disable unused Chrome package source
        if: runner.os == 'Linux'
        # Its package index can fail apt-get update; Tauri only needs Ubuntu libraries.
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # tauri-build validates that `frontendDist` exists, so the frontend must be built first.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Session continuity on the native platform
        run: pnpm --filter @concors/daemon exec vitest run src/hosting/gateway.test.ts src/terminal/profiles.test.ts
      - run: pnpm desktop:web:build

      - name: cargo fmt
        run: cargo fmt --check
        working-directory: apps/desktop/src-tauri

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri

  workspace-browser:
    name: Workspace browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Disable unused Chrome package source
        # Playwright downloads its own Chromium; this runner-provided apt source is unused.
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:workspace:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: workspace-browser-traces
          path: test-results/

  mobile-browser:
    name: Mobile browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:mobile:e2e
      - run: pnpm test:mobile:direct
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-browser-evidence
          path: apps/mobile/test-results/

  terminal-platforms:
    name: Terminal runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm daemon:test
