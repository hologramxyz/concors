appId: xyz.hologram.concors.preview
---
- launchApp:
    clearState: true
- tapOn:
    text: "Explore demo"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: native-agent-input
    timeout: 90000
- tapOn:
    text: "Checks"
    waitToSettleTimeoutMs: 500
# A clean simulator presents iOS's first-use swipe-typing tutorial on the first terminal focus.
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          text: "Continue"
          waitToSettleTimeoutMs: 500
- assertNotVisible: "Speed up your typing by sliding your finger across the letters to compose a word."
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: apps/mobile/test-results/native/marketing-terminal
