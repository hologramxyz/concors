appId: xyz.hologram.concors.preview
---
- launchApp:
    clearState: true
# A cold emulator can briefly put its own ANR dialog over the welcome screen.
# Recover only System UI; Concors crashes/ANRs and all app interactions still fail.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: "System UI isn't responding"
          commands:
            - tapOn: "Wait"
      - assertVisible: "Explore demo"
- tapOn: "Explore demo"
- extendedWaitUntil:
    visible: "Message Codex"
    timeout: 45000
- assertVisible: "Open sidebar"
- tapOn: "Message Codex"
- inputText: "Android draft survives navigation"
- assertVisible: "Android draft survives navigation"
- takeScreenshot: apps/mobile/test-results/android/composer-keyboard
- hideKeyboard
- tapOn: "Project files"
- assertVisible: "Back to chat"
- takeScreenshot: apps/mobile/test-results/android/files
- tapOn: "Back to chat"
- assertVisible: "Android draft survives navigation"
# The tab strip under the header: "+" at its end opens the New tab sheet.
- assertVisible: "Mobile launch 1"
- tapOn: "New tab"
- assertVisible: "New chat"
- takeScreenshot: apps/mobile/test-results/android/new-tab-sheet
