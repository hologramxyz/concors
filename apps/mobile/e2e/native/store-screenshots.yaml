appId: xyz.hologram.concors.preview
---
# Begin on the agent pane. These are real simulator captures of the shared
# workspace UI with fictional fixture data; inspect the output before uploading store assets.
- tapOn:
    id: native-header-chevron
- assertVisible: "Tabs"
- takeScreenshot: apps/mobile/test-results/native/store-workspaces
- tapOn: "Close"
- tapOn:
    id: native-agent-input
- eraseText: 100
- inputText: "Review the changes and run the tests."
- assertVisible:
    id: native-composer-model
# Show the sample task and progress instead of the fixture's demo instructions at the end.
- scrollUntilVisible:
    element: "Help me get the mobile client ready to test."
    direction: UP
    timeout: 30000
- takeScreenshot: apps/mobile/test-results/native/store-agent
- tapOn:
    id: native-header-files
- assertVisible:
    id: native-header-back
- takeScreenshot: apps/mobile/test-results/native/store-files
- tapOn:
    id: native-header-back
- assertVisible:
    id: native-agent-input
