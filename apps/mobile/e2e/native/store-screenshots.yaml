appId: xyz.hologram.concors.preview
---
# These are real simulator captures with fictional workspace data. Keep them read-only so the
# remaining native acceptance flow starts with an empty draft and the original agent selected.
- tapOn:
    id: native-header-chevron
    waitToSettleTimeoutMs: 500
- assertVisible: "Tabs"
- takeScreenshot: apps/mobile/test-results/native/store-workspaces
- tapOn:
    text: "Close"
    waitToSettleTimeoutMs: 500
- tapOn:
    id: native-header-files
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: native-header-back
- takeScreenshot: apps/mobile/test-results/native/store-files
- tapOn:
    id: native-header-back
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: native-agent-input
# Reveal earlier sample work using gestures within the conversation, above the composer.
- repeat:
    times: 3
    commands:
      - swipe:
          start: "50%,25%"
          end: "50%,70%"
          duration: 500
          waitToSettleTimeoutMs: 500
- takeScreenshot: apps/mobile/test-results/native/store-agent
