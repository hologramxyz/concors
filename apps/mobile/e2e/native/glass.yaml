appId: xyz.hologram.concors.preview
---
# XCTest owns the launch so its first tap reaches the active app window.
- launchApp:
    clearState: true
- tapOn:
    text: "Explore demo"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: native-agent-input
    timeout: 90000
- assertVisible:
    id: native-header-menu
- assertVisible:
    id: native-header-files
# Retain the store views even if a later control regression fails this same session.
- runFlow: store-screenshots.yaml
- tapOn:
    waitToSettleTimeoutMs: 500
    id: native-agent-input
- inputText: "Native Liquid Glass draft"
- assertVisible:
    id: native-composer-model
- assertVisible:
    id: native-composer-mic
- assertVisible:
    id: native-composer-context
- takeScreenshot: apps/mobile/test-results/native/composer-expanded
- tapOn:
    id: native-composer-model
    retryTapIfNoChange: true
# The trigger has the same accessible label as the sheet title. Its label alone cannot prove
# that XCTest opened the sheet; require a row that exists only in the presented picker.
- extendedWaitUntil:
    visible: "Provider"
    timeout: 30000
- tapOn:
    text: "Provider"
    waitToSettleTimeoutMs: 500
- assertVisible: "Providers"
- tapOn:
    text: "Codex"
    waitToSettleTimeoutMs: 500
# Back on the first page, whose title is the provider's name too; the model row is the second match.
- assertVisible: "Provider"
- tapOn:
    text: "Codex"
    index: 1
    waitToSettleTimeoutMs: 500
- assertVisible: "Native Liquid Glass draft"
- tapOn:
    waitToSettleTimeoutMs: 500
    id: native-composer-options
- assertVisible: "Plan mode"
- tapOn:
    text: "Thinking effort"
    waitToSettleTimeoutMs: 500
- assertVisible: "Default \\(medium\\)"
- tapOn:
    text: "Low"
    waitToSettleTimeoutMs: 500
- assertVisible: "Plan mode"
- tapOn:
    text: "Close"
    waitToSettleTimeoutMs: 500
- assertVisible: "Native Liquid Glass draft"
- tapOn:
    waitToSettleTimeoutMs: 500
    id: native-composer-options
- tapOn:
    text: "Permission mode"
    waitToSettleTimeoutMs: 500
- assertVisible: "Default permissions"
- tapOn:
    text: "Default permissions"
    waitToSettleTimeoutMs: 500
- assertVisible: "Plan mode"
- tapOn:
    text: "Close"
    waitToSettleTimeoutMs: 500
- assertVisible: "Native Liquid Glass draft"
- tapOn:
    waitToSettleTimeoutMs: 500
    id: native-header-files
- assertVisible:
    id: native-header-back
- takeScreenshot: apps/mobile/test-results/native/files-header
- tapOn:
    waitToSettleTimeoutMs: 500
    id: native-header-back
- assertVisible: "Native Liquid Glass draft"
# Hit testing belongs to the native SwiftUI label, so cover it on-device rather than in a mock.
# The title/subtitle area and empty vertical padding must open the same drawer as the chevron.
- tapOn:
    waitToSettleTimeoutMs: 500
    id: native-header-chevron
    point: "20%,35%"
- assertVisible: "Tabs"
- tapOn:
    text: "Close"
    waitToSettleTimeoutMs: 500
- assertVisible: "Native Liquid Glass draft"
- tapOn:
    waitToSettleTimeoutMs: 500
    id: native-header-chevron
    point: "20%,65%"
- assertVisible: "Tabs"
- tapOn:
    text: "Close"
    waitToSettleTimeoutMs: 500
- tapOn:
    waitToSettleTimeoutMs: 500
    id: native-header-chevron
    point: "50%,5%"
- assertVisible: "Tabs"
- tapOn:
    text: "Close"
    waitToSettleTimeoutMs: 500
- tapOn:
    waitToSettleTimeoutMs: 500
    id: native-header-chevron
    point: "90%,50%"
- assertVisible: "Tabs"
- takeScreenshot: apps/mobile/test-results/native/tabs-drawer
