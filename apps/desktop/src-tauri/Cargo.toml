[package]
name = "concors-desktop"
version = "0.1.0"
description = "Concors desktop client"
authors = ["Concors contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "concors_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
