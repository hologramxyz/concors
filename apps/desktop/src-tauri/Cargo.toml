[package]
name = "concors-desktop"
version = "0.9.0"
description = "Concors desktop client"
authors = ["Concors contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.89.0"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "concors_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The macOS window is transparent so the system blur shows behind the sidebar (tauri.macos.conf.json).
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
notify-rust = "=4.18.0"
tauri-plugin-clipboard-manager = "2"
# Remembers the main window's size and position. 2.5 requires a newer tauri than the one locked here.
tauri-plugin-window-state = "~2.4"

[target.'cfg(target_os = "macos")'.dependencies]
# notify-rust posts through NSUserNotificationCenter, which cannot tell whether macOS lets Concors
# show notifications; UNUserNotificationCenter reads and requests that permission.
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSError", "NSString", "NSUserDefaults"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotificationSettings", "UNUserNotificationCenter"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Same version Tauri's runtime already links, to answer the webview's microphone permission request.
webkit2gtk = "=2.0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
