<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Concors</title>
    <script src="%BASE_URL%assets/startup-appearance.js"></script>
    <link rel="stylesheet" href="/src/startup/startup.css" />
  </head>
  <body>
    <div id="root">
      <!-- Mirrors StartupScreen so React can take over without an empty first frame. -->
      <div
        class="concors-startup"
        data-startup-screen
        role="status"
        aria-label="Opening Concors"
        aria-busy="true"
      >
        <div class="concors-startup-brand" aria-hidden="true">
          <!-- concors:logo-mark (vite.config.ts fills it from brand/incoming/sources/logo-mark.svg) -->
          <div class="concors-startup-shimmer"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
